name: Dashboard data QA
on:
  push:
    branches: [main]
    paths:
      - 'lib/dashboard-visibility.ts'
      - 'lib/dashboard-display.ts'
      - 'lib/dashboard-freshness.ts'
      - 'lib/ingest-integrity.ts'
      - 'lib/transaction-reconciliation.ts'
      - 'supabase/**'
      - 'components/**'
      - 'app/api/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/dashboard-qa.yml'
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test tests/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_*.py'

