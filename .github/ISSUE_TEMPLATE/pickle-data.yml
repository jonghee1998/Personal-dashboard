name: "피클AI 데이터 연동"
description: "데이터 연동 오류 및 변경 요청"
title: "[DATA] "
body:
  - type: markdown
    attributes:
      value: "실제 개인정보와 API 토큰을 쓰지 마세요. 재현에는 가상 JSON만 사용하세요."
  - type: dropdown
    id: kind
    attributes:
      label: "데이터 종류"
      options:
        - transaction
        - settlement
        - news
        - benefit
        - task
        - event
        - journal
        - 기타
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: "증상 / 기대 결과"
      description: "실제값 없이 증상과 기대 결과를 설명해주세요."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "가상 데이터 재현 방법"
      render: json
  - type: input
    id: status
    attributes:
      label: "HTTP 상태코드"
      placeholder: "200 / 400 / 401 / 500"
  - type: textarea
    id: notes
    attributes:
      label: "요청 및 확인 항목"
